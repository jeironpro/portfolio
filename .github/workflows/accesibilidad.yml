name: Accesibilidad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    name: Accesibilidad, enlaces y recursos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: herramientas/accesibilidad/package-lock.json

      - name: Instalar dependencias
        working-directory: herramientas/accesibilidad
        run: npm ci

      - name: Comprobar accesibilidad
        working-directory: herramientas/accesibilidad
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm test

      - name: Comprobar enlaces y recursos
        if: ${{ !cancelled() }}
        working-directory: herramientas/accesibilidad
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run enlaces
